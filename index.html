<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CreatorTools - Free Creator Tools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            padding: 45px 10px 30px;
        }

        h1 {
            font-size: 45px;
            margin: 0 0 12px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 18px;
        }

        .tool {
            background: #1e293b;
            padding: 25px;
            border-radius: 18px;
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            resize: vertical;
            font-size: 16px;
            outline: none;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat {
            background: #334155;
            padding: 15px 20px;
            border-radius: 12px;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }

        .number {
            display: block;
            font-size: 25px;
            font-weight: bold;
        }

        .label {
            color: #cbd5e1;
            font-size: 14px;
        }

        footer {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
            padding-bottom: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>CreatorTools</h1>

        <p class="subtitle">
            Simple free tools for content creators.
        </p>
    </header>

    <div class="tool">

        <h2>Word & Character Counter</h2>

        <textarea
            id="text"
            placeholder="Paste or type your script here..."
        ></textarea>

        <div class="stats">

            <div class="stat">
                <span class="number" id="words">0</span>
                <span class="label">Words</span>
            </div>

            <div class="stat">
                <span class="number" id="characters">0</span>
                <span class="label">Characters</span>
            </div>

            <div class="stat">
                <span class="number" id="sentences">0</span>
                <span class="label">Sentences</span>
            </div>

        </div>

    </div>

    <footer>
        CreatorTools — Free tools for creators
    </footer>

</div>

<script>

const textBox = document.getElementById("text");

textBox.addEventListener("input", function () {

    const text = textBox.value;

    const words = text.trim()
        ? text.trim().split(/\s+/).length
        : 0;

    const characters = text.length;

    const sentences = text
        .split(/[.!?]+/)
        .filter(sentence => sentence.trim().length > 0)
        .length;

    document.getElementById("words").textContent = words;

    document.getElementById("characters").textContent = characters;

    document.getElementById("sentences").textContent = sentences;

});

</script>

</body>
</html>
